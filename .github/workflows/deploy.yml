name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.163.2'
  DEPLOY_BRANCH: gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Fetch race results
        continue-on-error: true
        run: python3 scripts/fetch_results.py

      # Installed from the release tarball rather than a marketplace action, so
      # this works on github.mit.edu (Enterprise), where third-party actions
      # only resolve if GitHub Connect is enabled.
      - name: Install Hugo (extended)
        run: |
          curl -sSLf -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      # hugo.toml's baseURL is correct only for the github.com deploy, so derive
      # it from whichever host/repo this run belongs to and pass it at build time.
      - name: Determine base URL
        run: |
          host="${GITHUB_SERVER_URL#https://}"
          if [ "$host" = "github.com" ]; then
            base="https://www.noahpaladino.com/mitcycling/"
          else
            base="https://pages.${host}/${GITHUB_REPOSITORY}/"
          fi
          echo "BASE_URL=$base" >> "$GITHUB_ENV"
          echo "Building with baseURL: $base"

      - name: Build site
        run: hugo --minify --baseURL "$BASE_URL"

      - name: Publish to ${{ env.DEPLOY_BRANCH }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public
          touch .nojekyll
          git init -q -b "$DEPLOY_BRANCH"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$DEPLOY_BRANCH"
